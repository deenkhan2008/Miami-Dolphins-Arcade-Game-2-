<html lang="en"><head><meta charset="utf-8">

<style>

.pr.on{border-color:#4fd8e2;background:#1d4152}
.row{display:flex;gap:6px;flex-wrap:wrap}

.btn{flex:1;border:0;border-radius:10px;padding:11px 6px;font-weight:700;font-size:14px;background:#1d4152}
.btn.pri{flex:2;background:#ff5a1f;color:#fff}.btn:disabled{opacity:.45}.btn:active:not(:disabled){transform:scale(.97)}

.wheel .wc{width:56px;height:56px;border-color:#fff;background:#16303f;font-size:15px}.wheel .wc small{display:block;font-size:9px;font-weight:400}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;overflow-y:auto;z-index:8;background:#10232f;border-radius:18px 18px 0 0;padding:12px;transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 30px rgba(0,0,0,.5)}

.sheet small{display:block;opacity:.65;margin:2px 0 8px}
#pb{display:grid;grid-template-columns:1fr 1fr;gap:6px}#pb button{text-align:left;background:#16303f;border:0;border-radius:10px;padding:8px 10px}#pb small{margin:2px 0 0}

.intro.off{opacity:0;pointer-events:none}.intro .fi{font-size:64px}
.intro h1{margin:0;font:900 44px/1 system-ui;letter-spacing:-1px}.intro h1 span{color:#ff7a3d}

.intro button{border:0;border-radius:14px;background:#ff5a1f;color:#fff;font-weight:800;font-size:18px;padding:14px 38px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
<div class="cv"><canvas id="c" aria-label="Football field with defensive play and your route calls"></canvas><div class="hud l" id="sb"></div><div class="hud r" id="sc"></div><div class="wheel" id="wheel"></div></div>
<div class="bar"><div id="roster"></div>
<div class="row"><button class="btn" id="pbk">Playbook</button><button class="btn" id="fg">Field goal</button><button class="btn" id="punt">Punt</button><button class="btn" id="sp" aria-label="Game speed">1×</button><button class="btn pri" id="go">Run play</button></div>
<div id="res"></div></div>
<div class="sheet" id="sheet"><div class="sh"><b>Playbook</b><button id="cls" aria-label="Close">✕</button></div><small>Tap a play to load all five players. Concepts are inspired by Miami’s offense, not an official playbook.</small><div id="pb"></div></div>
<div class="intro" id="intro"><div class="fi">🐬</div><h1>ROUTE <span>LAB</span></h1><p>Out-think the defense with Miami’s skill players.</p>
<ol><li>Tap a player to open the route wheel</li><li>Pick a route, run or draw your own</li><li>Run the play and move the chains</li></ol><button id="start">Start game</button></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),W=540,H=640,S=10,CX=270,DT=1/60,BS=32,HW=26.67,ORD=['','1st','2nd','3rd','4th'];
const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;g.scale(dpr,dpr);
let LY=480,view=25,dirty=1,spdm=1;const G={los:25,down:1,first:35,mia:0,opp:0,nxt:null};
const px=x=>CX+x*S,pyw=f=>LY-(f-view)*S,py=y=>pyw(G.los+y),vOf=s=>.12*s-3.5,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const P=[
{id:'hill',n:10,nm:'Tyreek Hill',pos:'WR',x:-23,y:0,spd:99,rte:90,hnd:88,elu:90},
{id:'wad',n:17,nm:'Jaylen Waddle',pos:'WR',x:23,y:0,spd:96,rte:92,hnd:86,elu:88},
{id:'mal',n:83,nm:'Malik Washington',pos:'WR',x:-13,y:-1,spd:86,rte:84,hnd:84,elu:86},
{id:'jon',n:9,nm:'Jonnu Smith',pos:'TE',x:9,y:0,spd:82,rte:78,hnd:82,elu:80},
{id:'ach',n:28,nm:'De’Von Achane',pos:'RB',x:-3,y:-5,spd:97,rte:80,hnd:80,elu:95}];
const QB={n:1,x:0,y:-5,acc:92};
const R={go:{c:1,w:s=>[[0,35]]},post:{c:1,w:s=>[[0,12],[-s*9,28]]},corner:{c:1,w:s=>[[0,12],[s*9,28]]},
out:{w:s=>[[0,9],[s*12,9]]},dig:{w:s=>[[0,12],[-s*14,12]]},curl:{w:s=>[[0,12],[-s,9]]},
slant:{w:s=>[[0,2],[-s*9,9]]},flat:{w:s=>[[s*12,1]]},comeback:{w:s=>[[0,16],[s*3,12]]},
inside:{run:1,h:.4,c:1,w:s=>[[2,3],[2,8],[2,22]]},outz:{run:1,h:.45,c:1,w:s=>[[s*8,1],[s*14,5],[s*15,22]]},
drawp:{run:1,h:1.2,c:1,w:s=>[[0,1],[1,6],[1,22]]},counter:{run:1,h:.6,c:1,w:s=>[[-s*3,1],[s*6,3],[s*11,9],[s*11,24]]},
toss:{run:1,h:.7,c:1,w:s=>[[s*14,-1],[s*21,6],[s*21,24]]},block:{}};
const LW={go:'Go',post:'Post',corner:'Corner',out:'Out',dig:'Dig',curl:'Curl',slant:'Slant',flat:'Flat',comeback:'Back',inside:'Inside',outz:'Outside',drawp:'Draw',counter:'Counter',toss:'Toss',block:'Block',draw:'✏'};
const RUN=['inside','outz','drawp','counter','toss','flat','curl','slant','block'],AIR=['go','post','corner','out','dig','curl','slant','flat','comeback','block'];
const keys=id=>P.find(p=>p.id===id).pos==='RB'?RUN:AIR;
const BK=[
{n:'Yankee',d:'Deep post plus deep dig.',a:{hill:'post',wad:'dig',mal:'curl',jon:'flat',ach:'block'}},
{n:'Mesh',d:'Crossing slants, Hill clears.',a:{hill:'go',wad:'corner',mal:'slant',jon:'slant',ach:'flat'}},
{n:'Cheetah Shot',d:'Both WRs go deep.',a:{hill:'go',wad:'go',mal:'dig',jon:'block',ach:'block'}},
{n:'Quick Game',d:'Slants and flat vs blitz.',a:{hill:'slant',wad:'slant',mal:'out',jon:'curl',ach:'flat'}},
{n:'Corner-Post',d:'Split-safety shot.',a:{hill:'corner',wad:'post',mal:'dig',jon:'block',ach:'block'}},
{n:'Inside Zone',d:'Achane to the A-gap.',a:{ach:'inside',hill:'block',wad:'block',mal:'block',jon:'block'}},
{n:'Outside Zone',d:'Stretch it wide.',a:{ach:'outz',hill:'block',wad:'block',mal:'block',jon:'block'}},
{n:'Draw',d:'Fake pass, late handoff.',a:{ach:'drawp',hill:'go',wad:'go',mal:'curl',jon:'block'}},
{n:'Toss Sweep',d:'Pitch to the edge.',a:{ach:'toss',hill:'block',wad:'block',mal:'block',jon:'block'}},
{n:'Counter',d:'Fake one way, cut back.',a:{ach:'counter',hill:'go',wad:'block',mal:'block',jon:'block'}}];
const z=(l,x,y,zx,zy,r,deep,spd)=>({k:'zone',l,x,y,zx,zy,r,deep,spd}),m=(l,x,y,tg,spd,cu)=>({k:'man',l,x,y,tg,spd,cu}),rs=(x,y=1.5,l='')=>({k:'rush',l,x,y});
const DL=[rs(-5),rs(-1.7),rs(1.7),rs(5)];
const PL=[
{name:'Cover 3 Zone',pr:3.7,tip:'Cover 3 is thin in the seams and flats. Digs and Slants sit between the linebackers and deep third; the light box is run-friendly.',
d:[...DL,z('CB',-21,8,-20,14,9,1,91),z('FS',0,14,0,17,11,1,88),z('CB',21,8,20,14,9,1,91),z('LB',-15,5,-14,6,7,0,82),z('LB',-5,5,-5,7,6,0,82),z('S',6,6,5,7,6,0,86),z('LB',16,5,14,6,7,0,82)]},
{name:'Cover 2 Zone',pr:3.7,tip:'Cover 2 leaves the deep middle open between the safeties. Posts and Corners behind the squatting corners are the classic answer.',
d:[...DL,z('CB',-22,5,-22,6,8,0,91),z('CB',22,5,22,6,8,0,91),z('S',-11,14,-11,16,10,1,88),z('S',11,14,11,16,10,1,88),z('LB',-9,5,-9,7,6,0,82),z('LB',0,5,0,8,7,0,82),z('LB',9,5,9,7,6,0,82)]},
{name:'Cover 1 Man + Blitz',pr:2.6,tip:'Man coverage with a fifth rusher shrinks the clock. Slants and Flats beat the blitz, and draws punish an aggressive rush.',
d:[...DL,rs(0,4,'LB'),m('CB',-23,7,'hill',92,6),m('CB',23,7,'wad',91,6),m('NB',-13,6,'mal',87,4),m('S',9,5,'jon',85,3),m('LB',-4,5,'ach',80,2),z('FS',0,16,0,18,12,1,89)]}];
let play,asg,mode,sim,sel='hill',dm=false,dp=null,nc=0,last=0,acc=0,res='',chip=null,wopen=false;
const dir=id=>P.find(p=>p.id===id).x<0?-1:1,lab=a=>a.pts?'Drawn':LW[a.r];
const spot=l=>l===50?'50':l<50?'MIA '+l:'OPP '+(100-l),dnT=s=>ORD[s.down]+' & '+(s.first>=100?'Goal':s.first-s.los);
function mkPath(p,a){let pts;if(a.pts)pts=a.pts.map(q=>q.slice());else{pts=[[p.x,p.y]];R[a.r].w(a.s).forEach(o=>pts.push([cl(p.x+o[0],-25.5,25.5),p.y+o[1]]))}
const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,c:a.pts?0:R[a.r].c}}
function atPath(pa,d){const p=pa.pts,c=pa.cum,n=p.length-1;
if(d>=c[n]){const e=p[n];if(!pa.c)return e;const a=p[n-1],L=c[n]-c[n-1]||1,k=(d-c[n])/L;return[cl(e[0]+(e[0]-a[0])*k,-25.5,25.5),e[1]+(e[1]-a[1])*k]}
let i=1;while(c[i]<d)i++;const k=(d-c[i-1])/((c[i]-c[i-1])||1);return[p[i-1][0]+(p[i][0]-p[i-1][0])*k,p[i-1][1]+(p[i][1]-p[i-1][1])*k]}
function newPlay(){let n;do{n=PL[Math.floor(Math.random()*PL.length)]}while(n===play);play=n;asg={};mode='plan';sim=null;dm=false;wheel(0);ui()}
function setRoute(k){if(mode!=='plan')return;if(k==='clear')delete asg[sel];else asg[sel]={r:k,s:(asg[sel]&&asg[sel].s)||dir(sel)};res='';ui()}
function ui(){dirty=1;const st=G.nxt||G,pl=mode==='plan';
$('sb').innerHTML='<b>MIA '+G.mia+' – OPP '+G.opp+'</b>'+dnT(st)+' at '+spot(st.los)+'<br><small>vs '+play.name+'</small>';
$('sc').innerHTML=chip?'<span class="n">'+chip[0]+'<small>/100</small></span><br><small>'+chip[1]+'</small>':'<small>Play score</small><br><span class="n">–</span>';
$('roster').innerHTML=P.map(p=>{const a=asg[p.id];return `<div class="pr${sel===p.id?' on':''}" data-id="${p.id}" tabindex="0" role="button"><b>${p.n}</b>${p.nm.split(' ').pop()}<em>${a?lab(a):''}</em></div>`}).join('');
$('pb').innerHTML=BK.map((b,i)=>`<button data-i="${i}"><b>${b.n}</b><small>${b.d}</small></button>`).join('');
$('go').style.display=mode==='sim'?'none':'';$('go').textContent=mode==='done'?'Next play':'Run play';
$('pbk').disabled=!pl;$('fg').style.display=$('punt').style.display=pl&&G.down===4?'':'none';$('fg').disabled=117-G.los>60;
cv.style.touchAction=dm?'none':'manipulation';
const sp=P.find(p=>p.id===sel);
$('res').innerHTML=res||(dm?'<p>Drag on the field to draw '+sp.nm.split(' ').pop()+'’s '+(sp.pos==='RB'?'run':'route')+'.</p>':'<p>Tap a player to open the route wheel, then run the play.</p>')}
function wheel(on){wopen=on&&mode==='plan';const w=$('wheel');if(!wopen){w.style.display='none';return}
const p=P.find(p=>p.id===sel),b=cv.getBoundingClientRect(),k=b.width/W,it=keys(sel).concat('draw'),n=it.length,Rr=Math.min(b.width*.3,104),m=Rr+32,
cx=cl(px(p.x)*k,m,b.width-m),cy=cl(py(p.y)*k,m,b.height-m),cur=asg[sel]&&asg[sel].r;
w.innerHTML=it.map((r,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return `<button data-r="${r}" class="${R[r]&&R[r].run?'run ':''}${cur===r||(r==='draw'&&asg[sel]&&asg[sel].pts)?'on':''}" style="left:${cx+Rr*Math.cos(a)}px;top:${cy+Rr*Math.sin(a)}px;animation-delay:${i*12}ms">${LW[r]}</button>`}).join('')+`<button class="wc" data-r="clear" style="left:${cx}px;top:${cy}px">${p.n}<small>clear</small></button>`;
w.style.display='block'}
$('wheel').onclick=e=>{const b=e.target.closest('button'),r=b&&b.dataset.r;wheel(0);if(!r)return;if(r==='draw'){dm=true;res='';ui()}else{dm=false;setRoute(r)}};
const pickP=id=>{sel=id;ui();wheel(1)};
$('roster').onclick=e=>{const r=e.target.closest('.pr');if(r&&mode==='plan')pickP(r.dataset.id)};
$('roster').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const r=e.target.closest('.pr');if(r){e.preventDefault();if(mode==='plan')pickP(r.dataset.id)}}};
$('pbk').onclick=()=>$('sheet').classList.add('open');$('cls').onclick=()=>$('sheet').classList.remove('open');
$('pb').onclick=e=>{const b=e.target.closest('button');if(!b||mode!=='plan')return;const pk=BK[b.dataset.i];asg={};for(const id in pk.a)asg[id]={r:pk.a[id],s:dir(id)};res='<p>Loaded <b>'+pk.n+'</b>: '+pk.d+'</p>';$('sheet').classList.remove('open');ui()};
$('sp').onclick=()=>{spdm=spdm===1?1.5:spdm===1.5?2:1;$('sp').textContent=spdm+'×'};
$('start').onclick=()=>$('intro').classList.add('off');
$('go').onclick=()=>{if(mode==='done'){if(G.nxt){Object.assign(G,G.nxt);G.nxt=null}res='';chip=null;newPlay()}else if(mode==='plan'){if(!Object.values(asg).some(a=>a.r!=='block')){res='<p>Give at least one player a route first.</p>';ui();return}runPlay()}};
const loc=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]};
function addPt(e){const[X,Y]=loc(e),q=[cl((X-CX)/S,-25.5,25.5),Math.min((LY-Y)/S+view-G.los,40)],l=dp[dp.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])>1.3&&dp.length<30){dp.push(q);dirty=1}}
cv.onpointerdown=e=>{if(mode!=='plan'||!dm)return;const p=P.find(p=>p.id===sel);dp=[[p.x,p.y]];cv.setPointerCapture(e.pointerId);addPt(e)};
cv.onpointermove=e=>{if(dp)addPt(e)};
cv.onpointerup=()=>{if(!dp)return;if(dp.length>1)asg[sel]={r:'draw',pts:dp,run:P.find(p=>p.id===sel).pos==='RB',h:.5};dp=null;dm=false;nc=1;res='';ui()};
cv.onclick=e=>{if(nc){nc=0;return}if(mode!=='plan'||dm)return;const[X,Y]=loc(e);let best=null,bd=26;P.forEach(p=>{const d=Math.hypot(px(p.x)-X,py(p.y)-Y);if(d<bd){bd=d;best=p}});if(best)pickP(best.id)};
$('fg').onclick=()=>kick('fg');$('punt').onclick=()=>kick('punt');
function runPlay(){sim={t:0,rs:[],ds:[],blk:0,phase:'play',best:0,yt:0,sackAt:Math.random()<.05?1.3+Math.random()*1.2:0};wheel(0);
P.forEach(p=>{const a=asg[p.id],r={...p,h:[],v:vOf(p.spd),path:null,role:a?(a.r==='block'?'block':'route'):'idle',a};
if(r.role==='route'){r.path=mkPath(p,a);r.c=r.path.c;r.tmin=Math.max(.6,Math.min(r.path.cum[1],12)/r.v*.6);
if(a.run||R[a.r]&&R[a.r].run){r.run=1;sim.run=1;sim.runner=r;sim.hand=a.pts?.5:R[a.r].h}}
if(r.role==='block')sim.blk++;sim.rs.push(r)});
sim.pr=play.pr+sim.blk*.6;play.d.forEach(d=>sim.ds.push({...d,sx:d.x,sy:d.y,tried:0,stun:0}));
res='<p>Play is live…</p>';chip=null;mode='sim';ui()}
const lag=(r,s)=>r.h[Math.max(0,r.h.length-1-Math.round(s*60))];
const sepOf=r=>{let b=99;for(const d of sim.ds)if(d.k!=='rush')b=Math.min(b,Math.hypot(d.x-r.x,d.y-r.y));return b};
function tick(){const s=sim,t=(s.t+=DT),ym=108-G.los,rr=s.run&&t>=s.hand+.25;
for(const r of s.rs){if(r.caught)continue;if(r.path){const q=atPath(r.path,r.v*(r.run?Math.max(0,t-s.hand)*.92:t));r.x=q[0];r.y=Math.min(q[1],ym)}r.h.push([r.x,r.y])}
for(const d of s.ds){if(s.phase==='ret')break;if(d.stun>0){d.stun-=DT;continue}
if(d.k==='rush'&&!rr){if(s.phase==='yac')continue;const f=Math.min(t/s.pr,1)*.9;d.x=d.sx*(1-f);d.y=d.sy+(-5-d.sy)*f;continue}
let tx,ty,sp=d.k==='rush'?4.2:vOf(d.spd);
if(s.phase==='yac'||rr){const q=s.tgt||s.runner;tx=q.x+(q.vx||0)*.3;ty=q.y+(q.vy||0)*.3;sp*=.97}
else if(s.phase==='air'&&Math.hypot(d.x-s.ball.x1,d.y-s.ball.y1)<12){tx=s.ball.x1;ty=s.ball.y1;sp*=1.02}
else if(d.k==='man'){const r=s.rs.find(o=>o.id===d.tg),q=lag(r,.1+(r.rte-80)*.008);tx=q[0]-Math.sign(q[0])*.6;ty=q[1]+.7+d.cu*Math.max(0,1-t/2.2);sp*=.98}
else{let b=null,bd=99;for(const r of s.rs){if(r.role==='block')continue;if(Math.hypot(r.x-d.zx,r.y-d.zy)<d.r){const k=Math.hypot(r.x-d.x,r.y-d.y);if(k<bd){bd=k;b=r}}}
if(b&&t>.3){const q=lag(b,.25);tx=q[0];ty=d.deep?Math.max(q[1]+2.5,d.zy-4):q[1]+.5;sp*=.93}else{tx=d.zx;ty=d.zy;sp*=.55}}
const dx=tx-d.x,dy=ty-d.y,L=Math.hypot(dx,dy);if(L>.01){const mv=Math.min(L,sp*DT);d.x+=dx/L*mv;d.y+=dy/L*mv}}
if(s.phase==='play'){
if(s.run){if(t>=s.hand){s.phase='rush';s.tgt=s.runner}}
else{if(s.sackAt&&t>=s.sackAt)return finish('sack');let best=null;
for(const r of s.rs){if(r.role!=='route'||t<r.tmin)continue;const o=sepOf(r);s.best=Math.max(s.best,o);const sc=o+Math.max(0,r.y)*.03;if(!best||sc>best.sc)best={r,o,sc}}
if(best&&(best.o>=2.8||t>=s.pr-.3)){s.forced=best.o<1.8;return throwTo(best.r)}
if(t>=s.pr)return finish('sack')}}
else if(s.phase==='rush'){const r=s.runner;s.yt+=DT;if(G.los+r.y>=100)return finish('td');if(Math.abs(r.x)>=25.5)return finish('run');
for(const d of s.ds){if(d.tried||d.stun>0||(d.k==='rush'&&t<s.hand+(d.l==='LB'?.5:1.2)))continue;if(Math.hypot(d.x-r.x,d.y-r.y)<1){d.tried=1;if(Math.random()<(r.elu-70)/110){d.stun=.7;s.brk=(s.brk||0)+1}else return finish('run')}}
if(s.yt>7)finish('run')}
else if(s.phase==='air'){const b=s.ball,f=Math.min(1,(t-b.t0)/(b.t1-b.t0));b.x=b.x0+(b.x1-b.x0)*f;b.y=b.y0+(b.y1-b.y0)*f;if(f>=1)resolve()}
else if(s.phase==='ret'){const d=s.int;s.rt+=DT;d.y-=vOf(d.spd)*.85*DT;if(s.rt>1)finish('int')}
else if(s.phase==='yac'){const r=s.tgt;s.yt+=DT;r.x+=r.vx*DT;r.y+=r.vy*DT;
if(G.los+r.y>=100)return finish('td');if(Math.abs(r.x)>=25.5){r.x=cl(r.x,-25.5,25.5);return finish('comp')}
for(const d of s.ds){if(d.k==='rush'||d.tried||d.stun>0)continue;if(Math.hypot(d.x-r.x,d.y-r.y)<1){d.tried=1;if(Math.random()<(r.elu-70)/110){d.stun=.7;s.brk=(s.brk||0)+1}else return finish('comp')}}
if(s.yt>5)finish('comp')}}
function throwTo(r){const s=sim;let T=.4,q;for(let i=0;i<3;i++){q=atPath(r.path,r.v*(s.t+T));T=.12+Math.hypot(q[0],q[1]+5)/BS}
s.tgt=r;s.tt=s.t;s.ball={x0:0,y0:-5,x:0,y:-5,x1:q[0],y1:Math.min(q[1],108-G.los),t0:s.t,t1:s.t+T};s.phase='air'}
function resolve(){const s=sim,r=s.tgt,b=s.ball,sp=sepOf(r);s.sep=sp;s.pc=cl(.3+sp*.115+(r.hnd-80)*.008+(QB.acc-85)*.006,.04,.96);
if(Math.random()<s.pc){s.phase='yac';r.caught=true;
const a=atPath(r.path,r.v*s.t),c=atPath(r.path,r.v*(s.t-.15)),pt=r.path.pts,n=pt.length;let hx=a[0]-c[0],hy=a[1]-c[1];
if(Math.hypot(hx,hy)<.02){hx=pt[n-1][0]-pt[n-2][0];hy=pt[n-1][1]-pt[n-2][1]}
const L=Math.hypot(hx,hy)||1;hx/=L;hy=hy/L+.25;const M=Math.hypot(hx,hy);r.vx=hx/M*r.v*.9;r.vy=hy/M*r.v*.9;s.ball=null}
else{let nd=null,dd=99;for(const d of s.ds){if(d.k==='rush')continue;const k=Math.hypot(d.x-b.x1,d.y-b.y1);if(k<dd){dd=k;nd=d}}
if(nd&&Math.random()<cl((2.4-dd)*.2+(s.forced?.1:0),0,.45)){s.int=nd;s.phase='ret';s.rt=0;s.ball=null}else finish('inc')}}
function oppDrive(lo){let dn=1,tg=10,n=0,y0=lo,pts=0,end='punt';
while(n<15){n++;const r=Math.random();let q=0;
if(r<.04){end='turnover';break}
if(r<.12)q=-1-Math.floor(Math.random()*6);else if(r>=.38)q=Math.round(1+Math.pow(Math.random(),2)*17);
lo+=q;if(lo>=100){pts=7;end='touchdown';break}
if(q>=tg){dn=1;tg=Math.min(10,100-lo)}else{tg-=q;dn++}
if(dn>4){if(lo>=65){if(Math.random()<.85){pts=3;end='field goal'}else end='missed field goal'}break}}
const mia=pts?25:end==='punt'?(lo+40>=100?20:Math.max(1,60-lo)):Math.max(1,100-lo);
return{pts,mia,log:n+' plays, '+(lo-y0)+' yd, ending in a '+end+(pts?' (+'+pts+')':'')+'.'}}
function change(pos,L,why){const d=oppDrive(pos);G.opp+=d.pts;L.push(why+' The opponent drives: '+d.log+' Dolphins ball at '+spot(d.mia)+'.');return{los:d.mia,down:1,first:Math.min(100,d.mia+10)}}
function done(L,sc,gr){const st=G.nxt;chip=sc==null?null:[sc,gr];mode='done';
res=L.map(l=>'<p>'+l+'</p>').join('')+'<p><b>Next: '+dnT(st)+' at '+spot(st.los)+'.</b></p>'+(play&&sim?'<p class="tip">Film room: '+play.tip+'</p>':'');ui()}
function kick(t){const los=G.los,L=[];let pos,msg;
if(t==='fg'){const d=117-los,p=cl(1.02-(d-20)*.014,.15,.97);if(Math.random()<p){G.mia+=3;pos=25;msg='The '+d+' yd field goal is good, +3.'}else{pos=100-los;msg='The '+d+' yd field goal misses.'}}
else{pos=los+40>=100?20:Math.max(1,60-los);msg='Punt away.'}
G.nxt=change(pos,L,msg);sim=null;done(L,null)}
function finish(k){const s=sim,r=s.tgt,los=G.los;let sc,title,L=[];const sep=s.sep!=null?s.sep.toFixed(1):'',gain=(k==='comp'||k==='run')?Math.round(r.y):k==='sack'?-(4+Math.floor(Math.random()*5)):0;
if(k==='sack'){sc=5;title='Sacked for '+-gain;L.push('The rush got home at '+s.t.toFixed(1)+' s before Tua could find anyone.')}
else if(k==='int'){sc=2;title='Intercepted';L.push('A '+(s.int.l||'defender')+' undercut the throw to '+r.nm+' and picked it off.')}
else if(k==='inc'){sc=Math.round(10+Math.min(25,s.best*5));title='Incomplete';L.push('Tua went to '+r.nm+' at '+s.tt.toFixed(1)+' s with '+sep+' yd of separation. Catch chance '+Math.round(s.pc*100)+'%, and it fell incomplete.')}
else if(s.run){sc=k==='td'?100:cl(Math.round(28+gain*5+(s.brk||0)*4),5,99);title=k==='td'?'Touchdown':gain+' yd run';L.push(r.nm+' took the handoff'+(s.brk?' and broke '+s.brk+' tackle'+(s.brk>1?'s':''):'')+'.')}
else{sc=k==='td'?100:Math.min(99,Math.round(38+Math.max(-6,gain)*2+Math.min(20,s.sep*4)));title=k==='td'?'Touchdown':gain+' yd catch';
L.push(r.nm+' caught it with '+sep+' yd of separation ('+Math.round(s.pc*100)+'% catch chance) and kept running'+(s.brk?', breaking '+s.brk+' tackle'+(s.brk>1?'s':''):'')+'. Tua released at '+s.tt.toFixed(1)+' s.')}
const gr=sc>=90?'Elite call':sc>=75?'Great call':sc>=55?'Solid call':sc>=35?'Marginal':'Defense won',nl=Math.max(1,los+gain);let pos=null;
L[0]=title+'. '+L[0];
if(k==='td'){G.mia+=7;pos=25;L.push('Touchdown Dolphins, +7.')}
else if(k==='int'){pos=100-cl(Math.round(los+s.int.y),1,99);L.push('Turnover!')}
else if(nl>=G.first){G.nxt={los:nl,down:1,first:Math.min(100,nl+10)};L.push('First down.')}
else if(G.down>=4){pos=100-nl;L.push('Turnover on downs.')}
else G.nxt={los:nl,down:G.down+1,first:G.first};
if(pos!=null)G.nxt=change(pos,L,'');
done(L,sc,gr)}
function circ(x,y,rad,fill,txt,ring){g.beginPath();g.arc(px(x),py(y),rad,0,7);g.fillStyle=fill;g.fill();if(ring){g.lineWidth=3;g.strokeStyle=ring;g.stroke()}
if(txt){g.fillStyle='#fff';g.font='bold 12px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,px(x),py(y)+1)}}
function drawRoute(p,a,al){if(a.r==='block'){g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(px(p.x-1.3),py(p.y+1.9));g.lineTo(px(p.x+1.3),py(p.y+1.9));g.stroke();return}
const pa=mkPath(p,a),pts=pa.pts.slice();if(pa.c){const e=pts[pts.length-1],q=pts[pts.length-2],L=Math.hypot(e[0]-q[0],e[1]-q[1])||1;pts.push([e[0]+(e[0]-q[0])/L*2.5,e[1]+(e[1]-q[1])/L*2.5])}
if(pts.length<2)return;const run=a.run||R[a.r]&&R[a.r].run,col=run?'#ffd166':'#7ff7ff';
g.save();g.globalAlpha=al;g.strokeStyle=g.fillStyle=col;g.lineWidth=3;g.setLineDash(run?[]:[7,5]);g.beginPath();pts.forEach((q,i)=>i?g.lineTo(px(q[0]),py(q[1])):g.moveTo(px(q[0]),py(q[1])));g.stroke();g.setLineDash([]);
const e=pts[pts.length-1],q=pts[pts.length-2];g.translate(px(e[0]),py(e[1]));g.rotate(Math.atan2(-(e[1]-q[1]),e[0]-q[0]));g.beginPath();g.moveTo(0,0);g.lineTo(-11,-6);g.lineTo(-11,6);g.fill();g.restore()}
function field(){const a=view-(H-LY)/S-1,b=view+LY/S+1,x0=px(-HW),fw=2*HW*S;
g.fillStyle='#14341e';g.fillRect(0,0,W,H);g.fillStyle='#24306a';g.fillRect(x0,0,fw,Math.max(0,pyw(100)));
if(pyw(0)<H){g.fillStyle='#0b6f78';g.fillRect(x0,pyw(0),fw,H-pyw(0))}
for(let f=Math.floor(a/5)*5;f<b;f+=5){if(f<0||f>=100)continue;g.fillStyle=(f/5)%2?'#2f8a45':'#297b3d';g.fillRect(x0,pyw(f+5),fw,5*S+1)}
g.fillStyle='rgba(255,255,255,.85)';g.font='bold 24px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('DOLPHINS',CX,pyw(-5));g.fillText('END ZONE',CX,pyw(105));
const f0=Math.max(0,Math.ceil(a)),f1=Math.min(100,Math.floor(b));g.strokeStyle='rgba(255,255,255,.9)';
g.lineWidth=2;g.beginPath();for(let f=f0;f<=f1;f++)if(f%5==0&&f%100){g.moveTo(x0,pyw(f));g.lineTo(x0+fw,pyw(f))}g.stroke();
g.lineWidth=4;g.beginPath();for(const f of[0,100]){g.moveTo(x0,pyw(f));g.lineTo(x0+fw,pyw(f))}g.stroke();
g.lineWidth=1.5;g.beginPath();for(let f=f0;f<=f1;f++){const y=pyw(f);for(const x of[-11.8,11.8]){g.moveTo(px(x-.4),y);g.lineTo(px(x+.4),y)}for(const x of[-HW,HW]){g.moveTo(px(x),y);g.lineTo(px(x-Math.sign(x)*.8),y)}}g.stroke();
g.font='bold 26px system-ui';g.fillStyle='rgba(255,255,255,.7)';
for(let f=Math.max(10,Math.ceil(f0/10)*10);f<=Math.min(90,f1);f+=10){const n=String(f<=50?f:100-f);for(const sg of[-1,1]){g.save();g.translate(px(sg*19),pyw(f));g.rotate(sg*Math.PI/2);g.fillText(n,0,0);g.restore()}}
g.lineWidth=3;g.strokeStyle='#fff';g.beginPath();g.moveTo(px(-HW),0);g.lineTo(px(-HW),H);g.moveTo(px(HW),0);g.lineTo(px(HW),H);g.stroke();
g.strokeStyle='#3fa9ff';g.beginPath();g.moveTo(x0,pyw(G.los));g.lineTo(x0+fw,pyw(G.los));g.stroke();
if(G.first<100){g.strokeStyle='#ffe14d';g.beginPath();g.moveTo(x0,pyw(G.first));g.lineTo(x0+fw,pyw(G.first));g.stroke()}}
function draw(){view+=(G.los-view)*.14;if(Math.abs(G.los-view)<.01)view=G.los;LY=cl((110-view)*S,100,480);field();
for(let i=-2;i<=2;i++)circ(i*2,-.6,8,'#41505c');
const live=mode==='sim'||(mode==='done'&&sim),ds=live?sim.ds:play.d,os=live?sim.rs:P.map(p=>({...p,role:'idle'}));
if(!live){for(const d of ds){if(d.k==='zone'){g.beginPath();g.arc(px(d.zx),py(d.zy),d.r*S,0,7);g.fillStyle='rgba(230,60,60,.16)';g.fill();g.setLineDash([5,5]);g.strokeStyle='rgba(255,190,180,.8)';g.lineWidth=1.5;g.stroke();g.setLineDash([])}
else{const tx=d.k==='man'?P.find(p=>p.id===d.tg):QB;g.setLineDash([4,5]);g.strokeStyle='rgba(255,170,160,.9)';g.lineWidth=2;g.beginPath();g.moveTo(px(d.x),py(d.y));g.lineTo(px(tx.x),py(tx.y));g.stroke();g.setLineDash([])}}}
for(const p of P){const a=asg[p.id];if(a)drawRoute(p,a,live?.35:1)}
if(dp&&dp.length>1)drawRoute(P.find(p=>p.id===sel),{r:'draw',pts:dp,run:P.find(p=>p.id===sel).pos==='RB'},1);
for(const d of ds)circ(d.x,d.y,11,d.k==='rush'?'#7b241c':'#c0392b',d.l);
circ(QB.x,QB.y,13,'#005778',QB.n,'#fff');
for(const r of os){const on=!live&&sel===r.id,tg=sim&&sim.tgt===r;circ(r.x,r.y,13,'#008e97',r.n,on?'#ffe14d':tg?'#ff5a1f':'#fff')}
if(sim&&sim.ball)circ(sim.ball.x,sim.ball.y,5,'#8a4a1a',null,'#fff');
if(sim&&(sim.phase==='yac'||sim.phase==='rush'))circ(sim.tgt.x+.9,sim.tgt.y+.9,4,'#8a4a1a',null,'#fff');
if(sim&&sim.phase==='ret')circ(sim.int.x+.9,sim.int.y+.9,4,'#8a4a1a',null,'#fff')}
function frame(now){acc+=Math.min(.05,(now-last)/1000)*spdm;last=now;if(mode==='sim'){while(acc>=DT&&mode==='sim'){tick();acc-=DT}dirty=1}else acc=0;
if(dirty||Math.abs(G.los-view)>.005){dirty=0;draw()}requestAnimationFrame(frame)}
newPlay();requestAnimationFrame(t=>{last=t;frame(t)});
</script></body></html>
